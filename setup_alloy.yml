---
- name: Setup Alloy
  hosts: all
  become: true
  gather_facts: true
  vars:
    node_service_identifier: "{{ group_names[0] }}"
    service_group: "{{ group_names[0] }}-{{ cluster }}"
    system_architecture: "{{ architecture_map[ansible_architecture] | default(ansible_architecture) }}"
  vars_files:
    - group_vars/all.yml
    - group_vars/default.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  tasks:
    - name: Set service_identifier
      ansible.builtin.set_fact:
        service_identifier: "{{ node_service_identifier }}-{{ alloy.service_identifier_suffix }}-{{ cluster }}"

    - name: Include common handlers
      ansible.builtin.include_role:
        name: common
    - name: Include alloy role
      ansible.builtin.include_role:
        name: alloy
        public: true

  post_tasks:
    - name: Verify alloy
      block:
        # No version check: this playbook doesn't set the project the check falls back on
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ alloy_log_file_path }}"
            health_url: "http://127.0.0.1:{{ alloy.ports.http_listen_port }}/-/ready"
