---
- name: Set up SSV-DKG Client
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [dkg]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when:
        - type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run ssv_dkg role
      when:
        - type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common

        - name: Include ssv_dkg role
          ansible.builtin.include_role:
            name: ssv_dkg
            public: true

  post_tasks:
    - name: Verify ssv dkg
      when:
        - type in allowed_node_types
      block:
        # The health check is served over TLS with a self-signed cert, which the uri check would reject
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ ssv_dkg_log_file_path }}"
            version_command: "{{ ssv_dkg_bin_dir }}/{{ service_identifier }} version"
