---
- name: Set up Obol Charon
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [charon]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when:
        - type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run obol_charon role
      when:
        - type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common

        - name: Include obol_charon role
          ansible.builtin.include_role:
            name: obol_charon
            public: true

  post_tasks:
    - name: Verify obol charon
      when:
        - type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ obol_charon_log_file_path }}"
            version_command: "{{ obol_charon_bin_dir }}/{{ service_identifier }} version"
            health_url: "http://localhost:{{ obol.charon.ports.metrics }}/livez"
