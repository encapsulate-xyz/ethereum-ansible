---
- name: Set up Obol Lodestar
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [lodestar]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/default.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when:
        - type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run obol_lodestar role
      when:
        - type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common

        - name: Include obol_lodestar role
          ansible.builtin.include_role:
            name: obol_lodestar
            public: true

  post_tasks:
    - name: Verify obol lodestar
      when:
        - type in allowed_node_types
      block:
        # The validator client serves only metrics, which start before it waits for the beacon node
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ obol_lodestar_log_file_path }}"
            version_command: "{{ obol_lodestar_bin_dir }}/{{ service_identifier }} --version"
            health_url: "http://localhost:{{ obol.lodestar.ports.metrics }}/metrics"
