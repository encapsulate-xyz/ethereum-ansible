---
- name: Set up SSV Node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [node]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup Pre Tasks
      when:
        - type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run ssv_node role
      when:
        - type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common

        - name: Include ssv_node role
          ansible.builtin.include_role:
            name: ssv_node
            public: true

  post_tasks:
    - name: Verify ssv node
      when:
        - type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ ssv_node_log_file_path }}"
            version_command: "{{ ssv_node_bin_dir }}/{{ service_identifier }} version"
            health_url: "http://localhost:{{ ssv.node.ports.metrics }}/health"
